{% assign images = site.static_files | where_exp: "file", "file.extname == '.png' or file.extname == '.jpg' or file.extname == '.jpeg' or file.extname == '.gif' or file.extname == '.webp' or file.extname == '.avif'" %}
{% assign latest = images | sort: "path" | last %}

{% if latest %}
<img src="{{ latest.path | relative_url }}" alt="Latest image">
{% endif %}
